name: Naar Codeberg

# Zet de cisomatic na elke push naar main ook in de repo van de site op
# Codeberg, met git subtree. Dat doet naar-codeberg.sh. Nodig: het geheim
# CODEBERG_TOKEN en de variabele CODEBERG_REPO (eigenaar/repo). Zonder die
# variabele draait de workflow niet. Zie README.md, onder Binnen een site.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      eerste_keer:
        description: Vervang de map op Codeberg één keer door een subtree
        type: boolean
        default: false

concurrency:
  group: naar-codeberg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bijwerken:
    if: vars.CODEBERG_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werk de site op Codeberg bij
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: ${{ vars.CODEBERG_REPO }}
          CODEBERG_GEBRUIKER: ${{ vars.CODEBERG_GEBRUIKER }}
          GITHUB_TOKEN: ${{ github.token }}
          PAD: ${{ vars.CODEBERG_PAD || 'hb2025/content/forge/cisomatic' }}
          TAK: ${{ vars.CODEBERG_TAK || 'main' }}
          EERSTE_KEER: ${{ inputs.eerste_keer || false }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "::error::Het geheim CODEBERG_TOKEN ontbreekt."
            exit 1
          fi
          gebruiker="${CODEBERG_GEBRUIKER:-${CODEBERG_REPO%%/*}}"
          SITE_URL="https://${gebruiker}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git" \
          BRON_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            bash .github/naar-codeberg.sh
