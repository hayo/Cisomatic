name: Naar Codeberg

# Zet de cisomatic na elke push naar main ook in de repo van de site op
# Codeberg, met git subtree. Dat doet naar-codeberg.sh. Nodig: het geheim
# CODEBERG_TOKEN. Zonder dat geheim slaat de workflow zichzelf over. Zie
# README.md, onder Binnen een site.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      eerste_keer:
        description: Vervang de map op Codeberg één keer door een subtree
        type: boolean
        default: false

concurrency:
  group: naar-codeberg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Werk de site op Codeberg bij
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: ${{ vars.CODEBERG_REPO || 'hayo/codeberg-hayobethlehem.nl' }}
          CODEBERG_GEBRUIKER: ${{ vars.CODEBERG_GEBRUIKER }}
          GITHUB_TOKEN: ${{ github.token }}
          PAD: ${{ vars.CODEBERG_PAD || 'hb2025/content/forge/cisomatic' }}
          TAK: ${{ vars.CODEBERG_TAK }}
          EERSTE_KEER: ${{ inputs.eerste_keer || false }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "::warning::Het geheim CODEBERG_TOKEN ontbreekt, dus de site op Codeberg blijft zoals hij is."
            exit 0
          fi
          # Een geplakt token heeft soms een spatie of regeleinde erbij.
          token="$(printf '%s' "$CODEBERG_TOKEN" | tr -d '[:space:]')"
          gebruiker="${CODEBERG_GEBRUIKER:-${CODEBERG_REPO%%/*}}"
          SITE_URL="https://${gebruiker}:${token}@codeberg.org/${CODEBERG_REPO}.git" \
          BRON_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            bash .github/naar-codeberg.sh
